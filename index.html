<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Sorpresa Amarilla</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main class="phone-app">

    <!-- ESCENA 1: LUNA Y ESTRELLAS -->
    <section id="wishScene" class="scene active">

      <div class="led-frame"></div>

      <!-- Texto sobre la luna -->
      <p id="moonInstruction" class="moon-instruction">
        Para Miel
      </p>

      <!-- Luna -->
      <button
        id="moonButton"
        class="moon-frame"
        type="button"
        aria-label="Toca la luna"
      >
        <img src="assets/luna.png" alt="Luna" />
      </button>

      <!-- Título -->
      <h1 id="wishTitle" class="wish-text">
        Toca la luna
      </h1>

      <!-- Estrellas -->
      <div id="starsContainer" class="stars-container">

        <button class="wish-star" type="button" aria-label="Estrella 1">
          <span class="star-shape"></span>
        </button>

        <button class="wish-star" type="button" aria-label="Estrella 2">
          <span class="star-shape"></span>
        </button>

        <button class="wish-star" type="button" aria-label="Estrella 3">
          <span class="star-shape"></span>
        </button>

        <button class="wish-star" type="button" aria-label="Estrella 4">
          <span class="star-shape"></span>
        </button>

      </div>

      <div id="starDust" class="star-dust"></div>

    </section>


    <!-- ESCENA 2: FLORES -->
    <section id="flowerScene" class="scene">

      <div class="led-frame"></div>

      <div class="final-card glass">

        <div class="photo-frame">
          <img
            src="assets/foto.jpeg"
            alt="Foto especial"
          />
        </div>

        <div class="flower-container">

          <iframe
            id="flowerFrame"
            class="flower-frame"
            src="about:blank"
            data-src="flores/index.html"
            title="Flores amarillas animadas"
            scrolling="no"
          ></iframe>

        </div>

        <div class="message-box">
          <p>
            Que esta flor te recuerde lo perfecta que eres: auténtica, espontánea, real y, sobre todo, admirable. Eres alguien muy especial e importante en mi vida 😘😘😘❤️❤️❤️
          </p>
        </div>

        <p class="tap-text">
          Toca la pantalla para confeti 🎉
        </p>

      </div>

    </section>

  </main>


  <!-- CONFETI -->
  <canvas id="confettiCanvas"></canvas>


  <!-- MÚSICA -->
  <audio id="backgroundMusic" loop>
    <source
      src="music/musica.mp3"
      type="audio/mpeg"
    />
  </audio>


  <script src="js/main.js"></script>

</body>
</html>
